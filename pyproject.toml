[project]
name = "morphome-hn-vae"
version = "0.1.0"
description = "Generative 3D VAE over head-and-neck CT and organ-at-risk segmentations"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "SimpleITK",
    "pynrrd",
    "torch",
    "tqdm",
    "tensorboard",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["morphome"]
