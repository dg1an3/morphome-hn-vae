<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>morphome — synthetic corpus explorer</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #2a3038;
    --fg: #e6edf3; --dim: #8b949e; --accent: #58a6ff; --real: #f0883e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.45 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  /* The latent map is now a working surface, not a legend: it carries 400
     rendered thumbnails and is zoomed and panned, so it gets real width. */
  #app { display: grid; grid-template-columns: 520px 1fr; height: 100%; }
  /* The column scrolls as a whole rather than pinning the map and starving
     whatever is below it, so a short window hides nothing permanently. */
  #left { border-right: 1px solid var(--line); display: flex; flex-direction: column;
    min-height: 0; overflow-y: auto; }
  #controls .dot { margin-right: 0; }
  #structList { display: inline-flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #structList .ck { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; }
  #structList .ck.off { color: var(--dim); cursor: default; }
  #structList .ck.off .dot { opacity: .3; }
  #structList input { margin: 0; }
  #right { display: flex; flex-direction: column; min-height: 0; }
  h1 { font-size: 14px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line);
    font-weight: 600; letter-spacing: .2px; }
  h1 span { color: var(--dim); font-weight: 400; }
  .sect { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .sect h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin: 0 0 8px; font-weight: 600; }
  .sect h2 .sub { font-weight: 400; text-transform: none; letter-spacing: 0;
    opacity: .8; }
  .row .ck { display: flex; align-items: center; gap: 4px; color: var(--fg);
    min-width: 0; cursor: pointer; }
  .row button { background: #0b0e13; color: var(--fg); border: 1px solid var(--line);
    border-radius: 3px; padding: 3px 8px; font: inherit; cursor: pointer;
    flex: 0 0 auto; }
  .row button:hover { border-color: var(--accent); }
  canvas.scatter { width: 100%; display: block; background: #0b0e13;
    border: 1px solid var(--line); border-radius: 4px; cursor: crosshair; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .row label { color: var(--dim); min-width: 62px; }
  select, input[type=range] { flex: 1; }
  select { background: #0b0e13; color: var(--fg); border: 1px solid var(--line);
    border-radius: 3px; padding: 3px 6px; }
  .legend { display: flex; gap: 14px; margin-top: 8px; color: var(--dim); font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 5px; vertical-align: middle; }
  #meta { padding: 10px 14px; overflow: auto; flex: 1; min-height: 0; }
  #meta table { width: 100%; border-collapse: collapse; }
  #meta td { padding: 2px 0; }
  #meta td:last-child { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  #meta h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin: 0 0 8px; font-weight: 600; }
  #meta h2 + table + h2 { margin-top: 14px; }
  #meta h2 .sub { font-weight: 400; text-transform: none; letter-spacing: 0; }
  #meta .ck { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  #meta .ck input { margin: 0; }
  #meta .ck.off { color: var(--dim); cursor: default; }
  #meta .ck .dot { margin-right: 0; flex: 0 0 auto; }
  #meta .ck.off .dot { opacity: .3; }
  #views { flex: 1; display: grid; min-height: 0; }
  #views.mode3d { grid-template-columns: 1fr; }
  #views.mode3d .pane2d { display: none; }
  #views.mode3d .pane3d { border-right: 0; }
  #views.panes { grid-template-columns: repeat(3, 1fr); }
  #views.panes .pane3d { display: none; }
  .view { position: relative; border-right: 1px solid var(--line); min-height: 0; }
  .view:last-child { border-right: 0; }
  .view .vtk { position: absolute; inset: 0; }
  .view .tag { position: absolute; top: 8px; left: 10px; z-index: 2; color: var(--fg);
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    text-shadow: 0 1px 3px #000; pointer-events: none; }
  .view .orient { position: absolute; z-index: 2; color: #9fb3c8; font-size: 11px;
    font-weight: 700; letter-spacing: .05em; text-shadow: 0 1px 3px #000;
    pointer-events: none; }
  .view .orient.top { top: 30px; left: 50%; transform: translateX(-50%); }
  .view .orient.bottom { bottom: 28px; left: 50%; transform: translateX(-50%); }
  .view .orient.left { left: 9px; top: 50%; transform: translateY(-50%); }
  .view .orient.right { right: 9px; top: 50%; transform: translateY(-50%); }
  .view .idx { position: absolute; bottom: 8px; left: 10px; z-index: 2; color: var(--dim);
    font-size: 11px; text-shadow: 0 1px 3px #000; pointer-events: none;
    font-variant-numeric: tabular-nums; }
  #controls { border-top: 1px solid var(--line); padding: 8px 14px; display: flex;
    gap: 18px; align-items: center; flex-wrap: wrap; }
  #controls .grp { display: flex; gap: 8px; align-items: center; }
  #controls label { color: var(--dim); }
  #controls select { flex: 0 0 auto; }
  #controls .ck { color: var(--fg); display: flex; align-items: center; gap: 3px; }
  #controls button { background: #0b0e13; color: var(--fg); border: 1px solid var(--line);
    border-radius: 3px; padding: 3px 8px; font: inherit; cursor: pointer; }
  #controls button:hover { border-color: var(--accent); }
  .view .hint { position: absolute; top: 8px; right: 10px; z-index: 2; color: var(--dim);
    font-size: 11px; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #status { padding: 6px 14px; color: var(--dim); border-top: 1px solid var(--line);
    font-size: 12px; }
  .warn { color: #f85149; }
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <h1>morphome <span>— synthetic corpus explorer</span></h1>

    <!-- The 2D scatter is deliberately absent; app.js treats #sc2 as optional
         markup and no-ops without it, so pasting the canvas back restores it.
         The colour control and legend served both maps and live here now. -->
    <div class="sect">
      <h2>Latent map · UMAP 32 → 5 → 3
        <span class="sub">· drag rotate · shift/right drag pan · wheel zoom</span></h2>
      <canvas id="sc3" class="scatter" height="440"></canvas>
      <div class="row">
        <label class="ck" title="draw synthetic cases as rendered anatomy where they fit">
          <input type="checkbox" id="thumbOn" checked>anatomy</label>
        <label class="ck" title="show the real corpus as well">
          <input type="checkbox" id="showReal">real</label>
        <input type="range" id="thumbSz" min="20" max="140" value="52"
               title="thumbnail size">
        <button id="fit3" type="button">fit</button>
      </div>
      <div class="row">
        <label for="colorBy">colour</label>
        <select id="colorBy">
          <option value="corpus">corpus (real / synthetic)</option>
          <option value="sharpness">bone sharpness</option>
          <option value="n_present">organs present</option>
          <option value="body_frac">body fraction</option>
        </select>
      </div>
      <div class="legend">
        <span><i class="dot" style="background:var(--accent)"></i>synthetic</span>
        <span><i class="dot" style="background:var(--real)"></i>real</span>
      </div>
    </div>

    <div id="meta"></div>
  </div>

  <div id="right">
    <div id="views" class="mode3d">
      <div class="view pane3d"><div class="vtk" id="v3"></div>
        <div class="tag">3D orthogonal</div>
        <div class="hint">drag to rotate · scroll to zoom</div>
        <div class="idx" id="i3"></div></div>
      <div class="view pane2d"><div class="vtk" id="vK"></div>
        <div class="tag">transverse</div><div class="idx" id="iK"></div></div>
      <div class="view pane2d"><div class="vtk" id="vJ"></div>
        <div class="tag">coronal</div><div class="idx" id="iJ"></div></div>
      <div class="view pane2d"><div class="vtk" id="vI"></div>
        <div class="tag">sagittal</div><div class="idx" id="iI"></div></div>
    </div>
    <div id="controls">
      <div class="grp"><label for="layout">layout</label>
        <select id="layout">
          <option value="mode3d">3D orthogonal</option>
          <option value="panes">2D panes</option>
        </select></div>
      <div class="grp" id="planeGrp"><label>planes</label>
        <label class="ck"><input type="checkbox" id="pK" checked>T</label>
        <label class="ck"><input type="checkbox" id="pJ" checked>C</label>
        <label class="ck"><input type="checkbox" id="pI" checked>S</label>
        <button id="home3d" type="button">reset view</button></div>
      <div class="grp"><label for="slK">transverse</label>
        <input type="range" id="slK" min="0" max="127" value="64"></div>
      <div class="grp"><label for="slJ">coronal</label>
        <input type="range" id="slJ" min="0" max="127" value="64"></div>
      <div class="grp"><label for="slI">sagittal</label>
        <input type="range" id="slI" min="0" max="127" value="64"></div>
      <div class="grp"><label for="win">window</label>
        <input type="range" id="win" min="10" max="255" value="255"></div>
      <div class="grp"><label for="lev">level</label>
        <input type="range" id="lev" min="0" max="255" value="128"></div>
      <div class="grp"><label for="seg">2D organs</label>
        <input type="checkbox" id="seg"></div>
      <!-- Structure toggles live in the control bar, not the side panel: the
           panel is the first thing a short window squeezes, and these are the
           control the 3D view is steered with. Filled by app.js from the
           active profile's structure list. -->
      <div class="grp" id="structGrp"><label>3D</label><span id="structList"></span></div>
      <div class="grp" id="surfGrp"><label for="surfOp">surfaces</label>
        <input type="range" id="surfOp" min="5" max="100" value="100"
               title="Surface opacity. Below 100% a surface stops writing depth, so the slice planes stop being occluded by it and appear to float in front — use the per-structure toggles to see past a surface instead.">
        <button id="surfNone" type="button">none</button></div>
    </div>
    <div id="status">loading…</div>
  </div>
</div>

<script src="./vtk.js"></script>
<script src="./app.js"></script>
</body>
</html>
